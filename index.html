<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Logic - Interactive Envelope Engine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card-wrapper">
      <div class="heart-engine" id="heartContainer"></div>

      <div class="envelope-box" id="envelope">
        <div class="flap-top"></div>

        <div class="letter-sheet">
          <div class="letter-content">
            <h3>Pixel Logic</h3>
            <p>
              Master the engine, don't just write wrappers.<br> Happy Valentine's
              Day.
            </p>
            <span class="signature">⚡ ⚙️</span>
          </div>
        </div>

        <div class="pocket-front"></div>
      </div>

      <button class="trigger-btn" id="actionBtn">Open Letter</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
